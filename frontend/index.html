<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Title and description are overridden at startup by main.tsx using BRAND config;
         the values below are just loading-time placeholders. -->
    <title>ArcReel · Agent 驱动的 AI 视频创作工作台</title>
    <meta name="description" content="AI 视频创作工作台，统一管理项目、脚本、分镜、视频生成与 Agent 对话。" />
    
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <script>
      // 首屏渲染前落下配色主题，避免先闪一下默认主题；取值与规则同 src/stores/theme-store.ts，改时一起改
      (function () {
        var themes = { darkroom: true, fixer: true, baryta: false, silver: false };
        var theme;
        try { theme = localStorage.getItem("arcreel.theme"); } catch (e) {}
        if (!(theme in themes)) theme = "darkroom";
        document.documentElement.dataset.theme = theme;
        document.documentElement.classList.toggle("dark", themes[theme]);
      })();
    </script>

</head>
<body>
    <div id="app-root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
